<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameKeep - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        if (saved === "dark") document.documentElement.classList.add("dark");
        if (saved === "light") document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="min-h-screen bg-white dark:bg-slate-900 text-slate-900 dark:text-white flex items-center justify-center">
    <div class="max-w-lg w-full p-6 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/50">
      <h1 class="text-2xl font-bold">You’re logged in ✅</h1>
      <p class="mt-2 text-slate-600 dark:text-slate-300">Hello, {{ request.user.username }}.</p>

      <form class="mt-6" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="px-4 py-2 rounded-lg bg-slate-900 text-white dark:bg-white dark:text-slate-900">
          Log out
        </button>
      </form>
    </div>
  </body>
</html>
