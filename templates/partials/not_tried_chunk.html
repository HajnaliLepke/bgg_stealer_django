{% for game in not_tried_page %}
  {% include "wishlist_card.html" with game=game accent="primary" q=q owner=owner kind=kind %}
{% empty %}
  <div class="rounded-xl border border-dashed border-[#e5e7eb] dark:border-[#233648] p-6 text-sm text-[#637588] dark:text-[#92adc9]">
    No items here yet.
  </div>
{% endfor %}

{% if not_tried_page.has_next %}
  <div
    hx-ext="intersect"
    hx-get="{% url 'wishlist_not_tried_chunk' %}?page={{ not_tried_page.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if owner %}&owner={{ owner|urlencode }}{% endif %}{% if kind %}&kind={{ kind|urlencode }}{% endif %}"
    hx-trigger="intersect once"
    hx-swap="outerHTML"
    class="py-3 text-center text-xs text-[#637588] dark:text-[#92adc9]"
  >
    Loading…
  </div>
{% endif %}
