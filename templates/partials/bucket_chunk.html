{% for game in page_obj %}
  {% include "wishlist_card.html" with game=game accent=accent q=q owner=owner kind=kind %}
{% empty %}
  <div class="rounded-xl border border-dashed border-[#e5e7eb] dark:border-[#233648] p-6 text-sm text-[#637588] dark:text-[#92adc9]">
    No items here yet.
  </div>
{% endfor %}

{% if page_obj.has_next %}
  <div
    hx-ext="intersect"
    hx-get="{% url 'wishlist_bucket_chunk' bucket %}?page={{ page_obj.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if owner %}&owner={{ owner|urlencode }}{% endif %}{% if kind %}&kind={{ kind|urlencode }}{% endif %}"
    hx-trigger="intersect once"
    hx-swap="outerHTML"
    class="py-2 text-center text-xs text-[#637588] dark:text-[#92adc9]"
  >
    Loading…
  </div>
{% endif %}
